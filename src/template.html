<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <nav>
      <form id="location-search">
        <input
          type="search"
          name="city"
          id="city"
          pattern="\p{L}[\p{L}\p{M}' .\-]*"
          placeholder="City"
          required
        />
        <input
          type="search"
          name="country"
          id="country"
          pattern="\p{L}[\p{L}\p{M}' .\-]*"
          placeholder="Country"
          required
        />
        <button id="confirm-search" form="location-search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="25px"
          >
            <title>magnify</title>
            <path
              d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </form>
    </nav>
    <main>
      <section>
        <div id="city-country">Talofofo, Guam</div>
        <div id="time">3:58 AM</div>
        <div id="temp">79 °F</div>
        <div id="precipitation">Precipitation: <span>19</span>%</div>
        <div id="humidity">Humidity: <span>92</span>%</div>
        <div id="wind">Wind: <span>7</span>mph</div>
      </section>
      <div id="temp-toggle">
        <button id="fahrenheit">°F</button>
        <button id="celsius">°C</button>
      </div>
    </main>
  </body>
</html>
